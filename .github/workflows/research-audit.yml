name: validate CMB research audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate existing browser model and reference
        run: npm run check && npm run validate:research
      - name: Test independent peak robustness
        run: python -m unittest discover -s tests -p 'test_peak_robustness.py' -v
      - name: Reproduce binned TT diagnostics
        run: python scripts/run_peak_robustness.py > /tmp/peak-robustness.json
